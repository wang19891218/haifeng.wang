<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haifeng Wang - Research Lab</title>
    <meta name="description" content="Academic research lab website for Haifeng Wang - Structural Engineering, Computational Mechanics, Machine Learning">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #fff;
        }
        .container {
            text-align: center;
            padding: 2rem;
            max-width: 600px;
        }
        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            animation: fadeIn 0.6s ease-in;
        }
        .subtitle {
            font-size: 1.25rem;
            font-weight: 300;
            margin-bottom: 3rem;
            opacity: 0.9;
            animation: fadeIn 0.8s ease-in;
        }
        .loader {
            width: 60px;
            height: 60px;
            margin: 0 auto 2rem;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        .message {
            font-size: 1rem;
            opacity: 0.8;
            animation: fadeIn 1s ease-in;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @media (max-width: 640px) {
            h1 { font-size: 2rem; }
            .subtitle { font-size: 1rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Haifeng Wang</h1>
        <div class="subtitle">Research Lab</div>
        <div class="loader"></div>
        <div class="message">Loading website...</div>
    </div>
    <script>
        // Redirect to the main site immediately
        window.location.replace('/home.html');
    </script>
</body>
</html>
