<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boid Algorithm Visualization</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <h1>Boid Algorithm Visualization</h1>
    
    <div class="main-container">
        <div class="visualization-container">
            <div id="canvas-container"></div>
            
            <div class="controls">
                <div class="control-group">
                    <label for="alignment">Alignment:</label>
                    <input type="range" id="alignment" min="0" max="2" step="0.1" value="1.0">
                    <span id="alignmentValue">1.0</span>
                </div>
                <div class="control-group">
                    <label for="cohesion">Cohesion:</label>
                    <input type="range" id="cohesion" min="0" max="2" step="0.1" value="1.0">
                    <span id="cohesionValue">1.0</span>
                </div>
                <div class="control-group">
                    <label for="separation">Separation:</label>
                    <input type="range" id="separation" min="0" max="2" step="0.1" value="1.5">
                    <span id="separationValue">1.5</span>
                </div>
                <div class="control-group">
                    <label for="boidCount">Number of Birds:</label>
                    <input type="range" id="boidCount" min="10" max="500" step="10" value="200">
                    <span id="boidCountValue">200</span>
                </div>
            </div>
        </div>

        <div class="bird-parameters">
            <h2>Bird Parameters</h2>
            <div class="table-container">
                <table id="birdTable">
                    <thead>
                        <tr>
                            <th>Bird ID</th>
                            <th>Position (X, Y, Z)</th>
                            <th>Speed</th>
                            <th>Direction</th>
                            <th>Neighbors</th>
                        </tr>
                    </thead>
                    <tbody id="birdTableBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <p><a href="/trials/algorithms/">← Back to algorithms</a></p>
    <script src="boids.js"></script>
</body>
</html>
